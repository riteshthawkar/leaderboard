name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Combined-Leaderboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            Combined-Leaderboard/requirements.txt
            Combined-Leaderboard/requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate Python dependencies
        run: python -m pip check

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Run Python tests
        run: python -m pytest -q

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22"
          cache: npm
          cache-dependency-path: Combined-Leaderboard/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: Combined-Leaderboard/frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: Combined-Leaderboard/frontend
        run: npm audit

      - name: Lint frontend
        working-directory: Combined-Leaderboard/frontend
        run: npm run lint

      - name: Test frontend
        working-directory: Combined-Leaderboard/frontend
        run: npm run test:run

      - name: Build same-origin frontend
        working-directory: Combined-Leaderboard/frontend
        env:
          VITE_SAME_ORIGIN: "1"
        run: npm run build

      - name: Build GitHub Pages frontend
        working-directory: Combined-Leaderboard/frontend
        env:
          VITE_API_BASE_URL: https://api.example.test
          VITE_AUTH_TRANSPORT: bearer
          VITE_BASE_PATH: /leaderboard/
        run: npm run build:pages

      - name: Validate deployment shell scripts
        run: >-
          find deployment evaluation spatial_harness
          -type f -name '*.sh' -print0
          | xargs -0 -n1 bash -n

  containers:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build API image
        working-directory: Combined-Leaderboard
        run: docker build -f deployment/api/Dockerfile -t ms-vista-api:test .

      - name: Build same-origin image
        working-directory: Combined-Leaderboard
        run: docker build -t ms-vista:test .

      - name: Build frontend image
        working-directory: Combined-Leaderboard
        run: >-
          docker build
          -f frontend/Dockerfile
          --build-arg VITE_API_BASE_URL=
          --build-arg VITE_SAME_ORIGIN=1
          -t ms-vista-frontend:test
          frontend
